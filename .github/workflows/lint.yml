name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lua format and syntax (StyLua, CfxLua)
        run: npx --yes @johnnymorganz/stylua-bin --check .

      - name: Resource consistency
        run: node tools/check.mjs

      - name: Web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
